<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رواد المرافقة | الرواد</title>
<meta name="description" content="منصة برنامج المرافقة · مؤسسة الرواد للتربية والتعليم · فرع الأنشطة المكملة.">
<meta property="og:title" content="رواد المرافقة · مؤسسة الرواد">
<meta property="og:description" content="مواعيد المرافقة، الحضور، العادات اليومية، وحساب الولي.">
<meta property="og:image" content="https://rowadact.github.io/tasjil/og.jpg">
<meta property="og:type" content="website">
<meta name="theme-color" content="#094496">
<link rel="preload" href="https://rowadact.github.io/assets/graphik-medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="https://rowadact.github.io/assets/graphik-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="https://rowadact.github.io/assets/graphik-black.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="dns-prefetch" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="icon" href="/murafaqa/icon-192.png?v=2">
<link rel="manifest" href="/murafaqa/manifest.webmanifest?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/murafaqa/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رواد المرافقة">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{margin:0;height:100%;background:#F3F8FE;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #ld{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;overflow:hidden;transition:opacity .45s ease;font-family:Tahoma,sans-serif}
  #ld.out{opacity:0;pointer-events:none}
  #ld .blob{position:absolute;width:300px;height:300px;border-radius:50%;filter:blur(46px);opacity:.36;animation:rdr 10s ease-in-out infinite}
  #ld .b1{background:#127AD8;top:-80px;right:-90px}#ld .b2{background:#EB6608;bottom:-90px;left:-100px;animation-delay:-3s}#ld .b3{background:#F5AC00;bottom:28%;right:-140px;width:230px;height:230px;animation-delay:-6s}
  @keyframes rdr{50%{transform:translate(-30px,40px) scale(1.15)}}
  #ld .core{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center}
  #ld .disc{position:relative;z-index:2;width:150px;height:150px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 38px rgba(9,68,150,.18);animation:rpop 1.1s cubic-bezier(.2,1.6,.4,1) both}
  #ld .disc img{width:112px;height:auto}
  @keyframes rpop{0%{transform:scale(.2);opacity:0}60%{opacity:1}100%{transform:scale(1)}}
  #ld .orb{position:absolute;top:50%;left:50%;width:0;height:0;z-index:1;animation:rsp 3.2s linear infinite}
  #ld .orb i{position:absolute;border-radius:50%}
  #ld .o1 i{width:16px;height:16px;margin:-8px;transform:translate(0,-108px);background:#127AD8;box-shadow:0 0 14px #127AD8}
  #ld .o2{animation-duration:4.6s;animation-direction:reverse}#ld .o2 i{width:11px;height:11px;margin:-5.5px;transform:translate(0,-94px);background:#EB6608;box-shadow:0 0 12px #EB6608}
  #ld .o3{animation-duration:6s}#ld .o3 i{width:9px;height:9px;margin:-4.5px;transform:translate(0,-124px);background:#F5AC00;box-shadow:0 0 12px #F5AC00}
  #ld .o4{animation-duration:5.2s;animation-direction:reverse}#ld .o4 i{width:10px;height:10px;margin:-5px;transform:translate(0,-86px);background:#00873B;box-shadow:0 0 12px #00873B}
  @keyframes rsp{to{transform:rotate(360deg)}}
  #ld .bp{margin-top:46px;width:min(60vw,220px);height:7px;border-radius:7px;background:#E3EBF5;overflow:hidden;position:relative;z-index:2;animation:rfi .5s .7s both}
  #ld .bp i{display:block;height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#F5AC00,#EB6608,#127AD8,#094496);transition:width .25s ease}
  #ld .bn{margin-top:8px;font-weight:800;font-size:13px;color:#5B6B85;direction:ltr;position:relative;z-index:2;font-variant-numeric:tabular-nums;animation:rfi .5s .7s both}
  @keyframes rfi{from{opacity:0}}
  #ld.cont .disc,#ld.cont .bp,#ld.cont .bn{animation:none}
  .ins{position:fixed;left:12px;right:12px;bottom:14px;z-index:5;display:none;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 10px 30px rgba(9,68,150,.25);font-family:Tahoma,sans-serif;color:#0F2547;max-width:460px;margin:0 auto}
  .ins.on{display:flex;animation:u .4s ease}
  @keyframes u{from{transform:translateY(30px);opacity:0}}
  .ins img{width:44px;height:44px;border-radius:12px;box-shadow:0 0 0 1px #E2EAF4}
  .ins div{flex:1;font-size:13px;line-height:1.6}.ins b{display:block;font-size:14.5px}
  .ins button{font:inherit;font-weight:bold;border:0;border-radius:12px;padding:9px 14px;background:#094496;color:#fff;cursor:pointer}
  .ins .x{background:transparent;color:#8A9AB3;padding:6px;font-size:18px}
</style>
</head>
<body>
<div id="ld"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><div class="core"><div class="orb o1"><i></i></div><div class="orb o2"><i></i></div><div class="orb o3"><i></i></div><div class="orb o4"><i></i></div><div class="disc"><img alt="الرواد" src="https://rowadact.github.io/assets/logo.png"></div></div><div class="bp"><i id="ldb"></i></div><div class="bn" id="ldn">0%</div></div>
<div class="ins" id="ins"><img src="/murafaqa/icon-192.png" alt=""><div><b>ثبّت تطبيق «رواد المرافقة»</b><span id="insT">افتح المنصة من أيقونة على هاتفك مباشرة.</span></div><button type="button" id="insB">تثبيت</button><button type="button" class="x" id="insX" aria-label="إغلاق">✕</button></div>
<iframe id="f" title="رواد المرافقة" allow="clipboard-write; web-share"></iframe>
<script>
(function(){
  var APP='https://script.google.com/macros/s/AKfycbzYNA0yZgc7xvPIDeYIIoBvXcrfAg_papc76Zwy4FtowVoSX49OArSzdwe1iy77D5O7FQ/exec';
  var f=document.getElementById('f');
  var lp=0,lb=document.getElementById('ldb'),ln=document.getElementById('ldn');
  var lt=setInterval(function(){if(lp<55){lp+=(56-lp)*0.08;lb.style.width=lp+'%';ln.textContent=Math.round(lp)+'%';}},140);
  f.addEventListener('load',function(){clearInterval(lt);lb.style.width='55%';ln.textContent='55%';var l=document.getElementById('ld');if(l){setTimeout(function(){l.style.opacity=0;setTimeout(function(){l.remove();},450);},150);}});
  f.src=APP+location.search+location.hash;
  if('serviceWorker' in navigator){navigator.serviceWorker.register('/murafaqa/sw.js',{scope:'/murafaqa/'}).catch(function(){});}
  // دعوة التثبيت: أندرويد بزر، والآيفون بشرح «مشاركة ← إضافة إلى الشاشة الرئيسية». تظهر بعد 4 ثوانٍ، ولا تعود بعد إغلاقها أسبوعًا.
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  var ins=document.getElementById('ins'),evt=null,key='rm_ins_x';
  function snoozed(){try{return Number(localStorage.getItem(key)||0)>Date.now();}catch(e){return false;}}
  function hide(){ins.classList.remove('on');try{localStorage.setItem(key,String(Date.now()+7*864e5));}catch(e){}}
  document.getElementById('insX').onclick=hide;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();evt=e;if(!standalone&&!snoozed()){setTimeout(function(){ins.classList.add('on');},4000);}});
  document.getElementById('insB').onclick=function(){if(evt){evt.prompt();evt.userChoice.then(function(){ins.classList.remove('on');evt=null;});}else{hide();}};
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  // 3 نوفمبر: جسر الجولة داخل المنصة: تسأل هل التثبيت متاح، وتطلبه بزر «تثبيت التطبيق الآن»
  window.addEventListener('message',function(e){var d=e.data||{};
    if(d.rm==='env?'){try{e.source.postMessage({rm:'env',can:!!evt,standalone:!!standalone,ios:ios},'*');}catch(x){}}
    if(d.rm==='install'){if(evt){var src=e.source;evt.prompt();evt.userChoice.then(function(c){ins.classList.remove('on');evt=null;try{src.postMessage({rm:'installed',ok:c&&c.outcome==='accepted'},'*');}catch(x){}});}}
  });
  if(ios&&!standalone&&!snoozed()){document.getElementById('insT').innerHTML='اضغط زر المشاركة <b style="display:inline">⎋</b> ثم «إضافة إلى الشاشة الرئيسية».';document.getElementById('insB').textContent='فهمت';setTimeout(function(){ins.classList.add('on');},4000);}
})();
</script>
</body>
</html>
